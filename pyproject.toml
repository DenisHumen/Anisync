[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anisync"
version = "0.1.1"
description = "Modular anime browser, player and downloader desktop app"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anisync contributors" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "yt-dlp>=2024.5.27",
    "platformdirs>=4.2",
    "python-mpv>=1.0.7",  # in-app playback backend (needs native libmpv)
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pyinstaller>=6.0",   # desktop bundles (see packaging/Anisync.spec)
    "Pillow>=10.0",       # logo/icon generation (packaging/generate_logo.py)
]

[project.scripts]
anisync = "anisync.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anisync*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: integration tests that hit real network endpoints (run with -m live)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
