name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_glob: 'dist/Anisync-*.dmg'
          - os: windows-latest
            asset_glob: 'dist/Anisync-*-win.zip'
          - os: ubuntu-22.04
            asset_glob: 'dist/Anisync-*.AppImage'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ── native libmpv (bundled into the app so users install nothing) ──
      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Install libmpv + Qt deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 || sudo apt-get install -y libmpv1
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libfuse2 fuse

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path mpvdev | Out-Null
          gh release download --repo zhongfly/mpv-winbuild `
            --pattern 'mpv-dev-x86_64-2*.7z' --dir mpvdev
          $archive = Get-ChildItem mpvdev -Filter *.7z | Select-Object -First 1
          7z x $archive.FullName -ompvdev\extracted -y | Out-Null
          $dll = Get-ChildItem mpvdev\extracted -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found' }
          "ANISYNC_LIBMPV=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "libmpv: $($dll.FullName)"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ -z "$v" ] && v=$(python -c "import anisync; print(anisync.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: PyInstaller bundle
        # The spec force-collects the dynamically-imported providers/players,
        # bundles the logo + native libmpv (and its ffmpeg/libass deps), and
        # sets the per-OS icon.
        run: pyinstaller --noconfirm packaging/Anisync.spec
        shell: bash

      - name: Smoke-test the bundle (providers + bundled libmpv)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   APP="dist/Anisync.app/Contents/MacOS/Anisync" ;;
            Windows) APP="dist/Anisync/Anisync.exe" ;;
            *)       APP="dist/Anisync/Anisync" ;;
          esac
          out="$("$APP" --selfcheck)"
          echo "$out"
          echo "$out" | grep -q "selfcheck: OK" || { echo "providers/players missing"; exit 1; }
          echo "$out" | grep -q "libmpv: OK" || { echo "libmpv NOT bundled"; exit 1; }

      # ── macOS: .app → .dmg ──
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist/dmg
          cp -R "dist/Anisync.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Anisync" -srcfolder dist/dmg \
            -ov -format UDZO "dist/Anisync-${v}-mac.dmg"

      # ── Windows: portable zip ──
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist/Anisync/* -DestinationPath "dist/Anisync-$v-win.zip"

      # ── Linux: AppImage ──
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p AppDir/usr/bin
          cp -r dist/Anisync/* AppDir/usr/bin/
          cat > AppDir/Anisync.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Anisync
          Exec=Anisync
          Icon=anisync
          Categories=AudioVideo;Player;
          EOF
          cp packaging/anisync.png AppDir/anisync.png || touch AppDir/anisync.png
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool AppDir "dist/Anisync-${v}.AppImage"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anisync-${{ runner.os }}
          path: ${{ matrix.asset_glob }}

      # Release notes live in .github/releases/<tag>.md — written per
      # version, shown both on GitHub and inside the app's update dialog.
      # Falls back to a generic body when the file is missing.
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release_body.md
          else
            cat > release_body.md <<EOF
          ## Anisync ${GITHUB_REF_NAME}

          Self-contained desktop builds — **no extra installs needed**.

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon) | \`Anisync-*-mac.dmg\` |
          | Windows | \`Anisync-*-win.zip\` |
          | Linux | \`Anisync-*.AppImage\` |

          > macOS: the app is ad-hoc signed (no paid Apple Developer ID), so on
          > first launch right-click the app → **Open** to bypass Gatekeeper.
          EOF
          fi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_glob }}
          fail_on_unmatched_files: false
          body_path: release_body.md
